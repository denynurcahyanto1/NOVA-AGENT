events { worker_connections 1024; }
http {
    server {
        listen 80;
        server_name nova-agent.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name nova-agent.com;
        ssl_certificate /etc/letsencrypt/live/nova-agent.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nova-agent.com/privkey.pem;

        location /api {
            proxy_pass http://backend:8000;
        }
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}
