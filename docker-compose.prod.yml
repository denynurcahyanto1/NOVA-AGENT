version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend
    environment:
      - APP_ENV=production
    restart: always

  frontend:
    build: ./frontend
    restart: always

  redis:
    image: redis:alpine
    restart: always
